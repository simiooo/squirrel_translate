name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for example 0.1.0); manual runs only upload artifacts'
        required: true
        default: '0.1.0'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: powershell
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Package
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:RELEASE_TAG -replace '^v', '' }
          ./scripts/release.ps1 -Version $version -Architecture '${{ matrix.arch }}'
          ./scripts/test-install.ps1 -Version $version -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/release-${{ matrix.arch }}/*
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist/downloads
      - name: Prepare WinGet manifests and draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          foreach ($arch in @('amd64','arm64')) {
            New-Item -ItemType Directory -Path "dist/release-$arch" -Force | Out-Null
            Copy-Item "dist/downloads/windows-$arch/*" "dist/release-$arch/"
          }
          ./scripts/winget.ps1 -Version ($env:RELEASE_TAG -replace '^v','')
          Compress-Archive -Path dist/winget/manifests -DestinationPath dist/winget-manifests.zip
          $assets = @(Get-ChildItem dist/release-*/* -File | Where-Object { $_.Name -ne 'install.ps1' } | ForEach-Object { $_.FullName })
          $assets += (Resolve-Path dist/release-amd64/install.ps1).Path
          $assets += (Resolve-Path dist/winget-manifests.zip).Path
          gh release create $env:RELEASE_TAG --draft --verify-tag --title "squirrel_translate $env:RELEASE_TAG" --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
