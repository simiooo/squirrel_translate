name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: powershell
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
